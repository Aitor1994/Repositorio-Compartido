<!DOCTYPE html>
<html lang="en">

<body>
    <script>
/*Crea un programa que simule el lanzamiento de una moneda. Cada vez que se ejecute el programa, debe
generar aleatoriamente "Cara" o "Cruz". Luego, muestra el resultado en una alerta, en la consola y en la
página*/
    let aleatorio = Math.floor(Math.random() * (2)) + 1;
    
    if(aleatorio == 1){
        alert("Cara");
    }else{
        alert("Cruz");
    }


    </script>
</body>
