<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let base = parseInt(prompt("Introduce un numero:"));
        let altura = parseInt(prompt("Introduce un numero:"));

        document.write("BASE: " + base + " ALTURA: " + altura + "<br>");

        for(i=1; i <= altura; i++){
            for(j = 0; j < base; j++){
                
                if (i == 1 || i == altura) {
                    document.write("* ");
                } else if (j == 0 || j == base - 1) {
                    document.write("* ");
                } else {
                    document.write("&nbsp; &nbsp");}
                    }
                    document.write(`<br>`);
        }
    </script>
</body>
</html>
