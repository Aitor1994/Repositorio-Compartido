<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero = prompt("Escribe un numero para calcular los 50 numeros impares a partir de tu numero");
        let contador = 0;

        for(i = numero; contador < 50 ; i++){
            if(i % 2 != 0){
                document.write(i +", ");
                contador++;
            }
        }
    </script>
</body>
</html>
