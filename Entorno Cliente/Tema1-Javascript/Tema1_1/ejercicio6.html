<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<!--Crear una página que pida al usuario por pantalla su nombre y su correo electrónico. Mostrar los datos en la
página HTML de forma que el nombre lo pinte con <h1> y el correo con <h2> -->
    <script>
        let nombre = prompt("¿Cual es su nombre:");
        let hotmail = prompt("Escribe aqui su correo electronico");
        document.write(`<h1> Su nombre es ${nombre} </h1> <h2> y su correo es ${hotmail} </h2>`);
    </script>
    
</body>
</html>
