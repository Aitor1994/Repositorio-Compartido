<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let txt = "Hola Mundo";
    console.log(txt.indexOf("Mundo")); // Devuelve 5, que es la posición de la palabra "Mundo"

    txt = txt.replace("Mundo", "Universo");
    console.log(txt); // Devuelve "Hola Universo"

    console.log(txt.toUpperCase()); // Devuelve "HOLA UNIVERSO"
    console.log(txt.toLowerCase()); // Devuelve "hola universo"

    let nombre = "Juan";
    let apellido = "Pérez";
    console.log(`${nombre} ${apellido}`);  // Devuelve "Juan Pérez"

    let variable = "Cliente";
    console.log(variable.substring(0, 3)); // Devuelve "Cli"
    
    </script>    

</body>
</html>
